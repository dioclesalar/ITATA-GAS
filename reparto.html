<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITATA GAS · Reparto</title><link rel="stylesheet" href="/ui.css"><style>.container{max-width:700px}.job{border-left:5px solid #d42128;padding:18px}.job button{margin:4px}.job address{font-style:normal}.job .money{font-size:1.4rem;font-weight:800}</style></head>
<body><header class="top"><div><div class="brand">ITATA <span>GAS</span></div><small>Repartidores · Vista móvil de desarrollo</small></div><span id="who"></span></header>
<main class="container"><div id="message" class="notice" role="status"></div><section id="login" class="card login"><h1>Ingresar como repartidor</h1><p class="muted">Usá el correo y la contraseña que te haya entregado la empresa.</p><form id="auth"><label>Correo</label><input id="email" type="email" required autocomplete="username"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"><p><button>Iniciar sesión</button></p></form></section><div id="jobs" class="hidden"><div class="card row" style="justify-content:space-between"><div><h2>Mis entregas</h2><span class="muted">Pedidos asignados a tu cuenta</span></div><div><button id="refresh" class="secondary">Actualizar</button> <button id="logout" class="secondary">Salir</button></div></div><div id="entries"></div></div></main><footer class="footer">ITATA GAS · Versión web móvil, no APK · No usar con operaciones reales</footer>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',user=null;const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(s,error=false){$('message').textContent=s;$('message').className='notice show'+(error?' error':'');}
async function api(path,method='GET',data=null,key=null){const h={Accept:'application/json'};if(token)h.Authorization='Bearer '+token;if(data)h['Content-Type']='application/json';if(key)h['Idempotency-Key']=key;const r=await fetch(path,{method,headers:h,body:data?JSON.stringify(data):undefined,cache:'no-store'});const out=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof out.detail==='string'?out.detail:JSON.stringify(out.detail||out));return out;}
async function run(f){try{await f()}catch(e){say(e.message,true)}}
async function reload(){const arr=await api('/orders?branch_id='+encodeURIComponent(user.branch_id));const active=arr.filter(x=>x.status!=='entregado');$('entries').innerHTML=active.map(o=>`<article class="card job" data-id="${esc(o.id)}"><div class="row" style="justify-content:space-between"><h3>${esc(o.customer)}</h3><span class="status ${esc(o.status)}">${esc(o.status.replace('_',' '))}</span></div><address>${esc(o.address)}, ${esc(o.commune||'')}</address>${o.phone?`<div><a href="tel:${esc(o.phone.replace(/[^+0-9]/g,''))}">Llamar al cliente</a></div>`:''}<p class="money">${money(o.total_clp)}</p><p>Abonado: ${money(o.paid_clp)} · <strong>Falta: ${money(o.remaining_clp)}</strong></p><div><button class="secondary" data-action="view">Detalle</button>${o.status==='asignado'?'<button data-action="route">Salí a reparto</button>':''}<button data-action="pay" class="dark">Registrar abono</button><button data-action="done">Entregado</button></div></article>`).join('')||'<div class="card">No tienes pedidos pendientes asignados.</div>';}
$('auth').onsubmit=e=>{e.preventDefault();run(async()=>{const res=await api('/auth/login','POST',{email:$('email').value,password:$('password').value});token=res.access_token;user=await api('/auth/me');if(user.role!=='conductor')throw Error('Esta pantalla es para conductores. Usa /panel para administración');$('who').textContent=user.full_name;$('login').classList.add('hidden');$('jobs').classList.remove('hidden');$('password').value='';await reload();say('Sesión iniciada. Solo se muestran tus pedidos.')})};
$('refresh').onclick=()=>run(async()=>{await reload();say('Pedidos actualizados')});$('logout').onclick=()=>{token='';user=null;$('who').textContent='';$('jobs').classList.add('hidden');$('login').classList.remove('hidden');say('Sesión cerrada');};
$('entries').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;run(async()=>{const id=b.closest('[data-id]').dataset.id,path='/orders/'+id;
if(b.dataset.action==='view'){const o=await api(path);alert(`${o.customer}\n${o.address}, ${o.commune}\n${o.instructions||''}\n${o.items.map(x=>x.product+' '+x.sale_type+' × '+x.quantity).join('\n')}\nTotal ${money(o.total_clp)}\nSaldo ${money(o.remaining_clp)}`);return;}
if(b.dataset.action==='route'){if(!confirm('¿Confirmar salida a reparto?'))return;await api(path+'/en-route','POST');}
if(b.dataset.action==='pay'){const o=await api(path),amount=prompt('¿Cuánto pagó el cliente? Saldo: '+money(o.remaining_clp));if(amount===null)return;const n=Number(amount);if(!Number.isSafeInteger(n)||n<=0)throw Error('Monto inválido');const method=prompt('Método (efectivo, transferencia, tarjeta, otro)','efectivo');if(method===null)return;if(!['efectivo','transferencia','tarjeta','otro'].includes(method))throw Error('Método inválido');await api(path+'/payments','POST',{amount_clp:n,method},crypto.randomUUID());}
if(b.dataset.action==='done'){if(!confirm('¿Confirmas que entregaste los cilindros? Se descontará el stock de la sucursal.'))return;await api(path+'/deliver','POST');}
await reload();say('Pedido actualizado');})};
</script></body></html>
